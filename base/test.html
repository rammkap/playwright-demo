<body>
<div class="titles">
    <h1 id="h1-text">H1 TITLE</h1>
    <h2 class="h2-text">H2 TITLE</h2>
    <h3><span style="color:orange;">H3 TITLE</span></h3>

<div class='input and buttons'>
    <input type="text" value="default text" placeholder="type text">
    <input type="password" placeholder="type password">
    <input type="email" placeholder="type email">
    <button type="submit">Send message</button>
    <button type="submit" disabled>Send message disabled</button>
    <textarea placeholder="Text area"></textarea>
</div>

<form action="/action" method="POST">

    <input type="password" placeholder="type password">
    <input required type="email" placeholder="type email">
    <button type="submit">Send message</button>
    <button type="submit" disabled>Send message disabled</button>
    <textarea placeholder="Text area"></textarea>
    <button type="submit">Send form</button>
</form>
